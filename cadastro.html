<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Alfabetiza+ - Cadastro">

    <title>Alfabetiza+ | Cadastro</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <main class="cadastro-page">

        <section class="cadastro-card">

            <header class="cadastro-header">

                <h1 class="logo">Alfabetiza+</h1>

                <h2 class="cadastro-title">
                    Crie sua conta
                </h2>

                <p class="cadastro-description">
                    Preencha seus dados para começar o curso de Letramento Digital.
                </p>

            </header>


            <form class="cadastro-form">

                <div class="form-group">

                    <label for="nome">Nome completo</label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>

                </div>

                <div class="form-group">
                    <label for="idade">Idade: </label><input type="text" placeholder="Digite sua idade" id="idade">
                    
                    <label for="cidade">Cidade: </label><input type="text" placeholder="Digite sua cidade" id="cidade">
                
                    <label for="estado">Estado:</label>
                    <select class="estado" name="estado" id="estado">
                        <option value="selecione" selected disabled>Selecione aqui</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>

                </div>
                

                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button type="submit" class="cadastro-button">
                    Criar conta
                </button>

            </form>


            <footer class="cadastro-footer">

                <p>
                    Já possui uma conta?
                    <a href="index.html" class="login-link">
                        Entrar
                    </a>
                </p>

            </footer>

        </section>

    </main>

</body>

</html>
